name: Build ALL_IN_ONE

on:
  push:
    branches: [main]
    paths:
      - "00_MASTER_AGENT.md"
      - "AGENTS.md"
      - "0*_*.md"
      - "1*_*.md"
      - "20_USER_GUIDE.md"
      - "scripts/build_all_in_one.py"
      - ".github/workflows/build-all-in-one.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build combined document
        run: python scripts/build_all_in_one.py
      - name: Commit generated file
        run: |
          if git diff --quiet -- ALL_IN_ONE.md && git ls-files --error-unmatch ALL_IN_ONE.md >/dev/null 2>&1; then
            echo "ALL_IN_ONE.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ALL_IN_ONE.md
          git commit -m "build: regenerate ALL_IN_ONE"
          git push
